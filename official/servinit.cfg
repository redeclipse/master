// the master loads and saves authuser.cfg, authserv.cfg and servctrl.cfg itself; secrets.cfg holds the
// mastersmtpuser, mastersmtppass, masterturnstilesecret, masterdiscordclient and masterdiscordsecret that stay off GitHub
exec "secrets.cfg"

if (= $rehashing 0) [
    local ip
    ip = 157.90.7.176

    httpserverip $ip
    serverip $ip
    masterip $ip

    httpserver 1
    masterserver 1
]

// the versions whose servers and players make up the Ready queue's channels, "" for none
masterverdevel "2.0.9"
masterverrelease ""

// pages that may keep a remembered sign-in as a cookie
mastersigninorigin "https://www.redeclipse.net"

// accounts: mail goes out through Gmail as contact@redeclipse.net, and the website's captcha has to be solved there
mastersmtphost "smtp.gmail.com"
mastersmtpport 587
mastersmtpstarttls 1
mastermailfrom "contact@redeclipse.net"
mastermailname "Red Eclipse"
masterturnstilehost "www.redeclipse.net"
masteraccounturl "https://www.redeclipse.net/account"

httpcertfile "/home/qreeves/ssl/play.redeclipse.net/fullchain.pem"
httpkeyfile "/home/qreeves/ssl/play.redeclipse.net/privkey.pem"

sv_serverdesc "Official Server (play.redeclipse.net)"
sv_servermotd "^fwWelcome to the official ^frRed Eclipse ^fwserver. Join us on Discord at: ^fchttps://www.redeclipse.net/discord"
sv_serverurl "https://www.redeclipse.net/"
sv_serverclients 16 // maximum number of allowed clients
